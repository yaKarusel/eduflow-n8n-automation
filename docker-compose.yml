name: eduflow

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduflow}
      POSTGRES_USER: ${POSTGRES_USER:-eduflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=35
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - log_statement=none
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduflow} -d ${POSTGRES_DB:-eduflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 320m
    cpus: 0.50
    pids_limit: 180
    shm_size: 96mb
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:f9a15cc65378e4e5b6c3b1445c83985131938db8d8b5b1ab891d7d50196b2162
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mock-api:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-eduflow}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-eduflow}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_PROXY_HOPS: "1"
      NODE_ENV: production
      TZ: ${GENERIC_TIMEZONE:-Europe/Berlin}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Berlin}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=704}
      EXECUTIONS_MODE: regular
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "25000"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      META_MODE: ${META_MODE:-mock}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_IG_ACCOUNT_ID: ${META_IG_ACCOUNT_ID:-}
      META_API_VERSION: ${META_API_VERSION:-v26.0}
      MOCK_API_TOKEN: ${MOCK_API_TOKEN}
      APPROVAL_SECRET: ${APPROVAL_SECRET}
      HOT_LEAD_THRESHOLD: ${HOT_LEAD_THRESHOLD:-50}
      ANALYTICS_HOUR: ${ANALYTICS_HOUR:-9}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      EDUFLOW_MOCK_URL: ${EDUFLOW_MOCK_URL:-http://mock-api:8080}
      EDUFLOW_PUBLIC_URL: ${EDUFLOW_PUBLIC_URL}
      ALLOWED_MEDIA_HOSTS: ${ALLOWED_MEDIA_HOSTS:-example.com}
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [backend, proxy]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=96m
      - /home/node/.cache:rw,noexec,nosuid,uid=1000,gid=1000,mode=0700,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 900m
    cpus: 0.80
    pids_limit: 350
    logging: *logging

  mock-api:
    build:
      context: ./mock-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      META_MODE: ${META_MODE:-mock}
      MOCK_API_TOKEN: ${MOCK_API_TOKEN:?set MOCK_API_TOKEN}
      N8N_INTERNAL_URL: ${EDUFLOW_N8N_INTERNAL_URL:-http://n8n:5678}
      LOG_FILE: /data/requests.jsonl
      MAX_LOG_BYTES: "1048576"
      MAX_BODY_BYTES: "262144"
    volumes:
      - mock_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.30
    pids_limit: 100
    logging: *logging

  caddy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 100
    logging: *logging

networks:
  backend:
    internal: true
  proxy: {}

volumes:
  postgres_data: {}
  n8n_data: {}
  mock_data: {}
  caddy_data: {}
  caddy_config: {}
